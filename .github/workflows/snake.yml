name: Generate snake animation

on:
  schedule: # Refresh every 3 hours, away from the busy top of the hour.
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Generate contribution snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: calexandrepcjr
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Verify generated animations
        run: |
          test -s dist/snake.svg
          test -s dist/snake-dark.svg

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: "chore: refresh contribution snake animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
